<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beetle Scout · Ibex.tech</title>
<style>
:root{--bg:#f3f0e8;--sf:#fff;--tx:#1d2a1f;--mu:#6a7468;--ac:#b8321f;--bd:#d9d3c5;--vw:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--sf:#1c241e;--tx:#e8ece6;--mu:#9aa89c;--ac:#ff6a4d;--bd:#33403a;--vw:#0a0d0b}}
:root[data-theme="dark"]{--bg:#121813;--sf:#1c241e;--tx:#e8ece6;--mu:#9aa89c;--ac:#ff6a4d;--bd:#33403a;--vw:#0a0d0b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 16px 4px}h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;align-items:center}
button,label.btn{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:0 16px 16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
#stage{position:relative;height:min(68vh,640px);background:var(--vw);border-radius:10px;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
#zc{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
#zc button{width:34px;padding:4px 0;background:rgba(0,0,0,.55);color:#fff;border-color:transparent}
#zl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
aside{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;max-height:min(68vh,640px);overflow:auto}
.big{font-size:44px;font-weight:700;color:var(--ac);line-height:1}.mu{color:var(--mu);font-size:12px}
.meter{height:8px;background:var(--bd);border-radius:4px;margin:8px 0;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
#list{margin-top:10px;display:flex;flex-direction:column;gap:3px}
#list button{display:flex;justify-content:space-between;text-align:left;padding:4px 8px;font-size:13px}
#list button.on{background:var(--ac);color:#fff}
input[type=range]{width:140px}
label.up{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#thumbs{padding-top:0}#thumbs:empty{display:none}select{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px}
.adv{background:color-mix(in srgb,var(--ac) 14%,transparent);border-left:3px solid var(--ac);padding:6px 8px;margin:6px 0;border-radius:4px;font-size:12px}aside ul{margin:4px 0;padding-left:18px}
.ban{color:#fff;font-weight:800;font-size:18px;padding:10px 12px;border-radius:8px;margin-bottom:8px}.ban small{display:block;font-weight:400;font-size:12px;opacity:.95}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips span{flex:1;color:#fff;border-radius:8px;padding:6px 4px;text-align:center;font-weight:800;font-size:20px}.chips small{display:block;font-weight:600;font-size:10px;letter-spacing:.03em}.fb{margin:10px 0}
#fab{position:absolute;right:10px;bottom:10px;z-index:4;border-radius:28px;padding:12px 18px;font-weight:700;background:var(--ac);color:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:15px}
#guide{display:none;position:absolute;left:8px;right:8px;bottom:64px;z-index:3;background:rgba(0,0,0,.8);color:#fff;border-radius:10px;padding:8px 10px;align-items:center;gap:10px}#garr{font-size:30px;display:inline-block;transition:transform .3s;color:#4da3ff}#guide button{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
#sheet{display:none;position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;background:var(--sf);color:var(--tx);border-top:2px solid var(--ac);padding:10px 12px;z-index:5}#sx{float:right;padding:2px 8px}
#lg{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;display:flex;gap:10px;flex-wrap:wrap;max-width:70%}#lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}aside li{margin-bottom:3px}#thumbs button{font-size:12px;padding:4px 8px}
#drop{display:none;position:absolute;inset:8px;border:3px dashed #fff;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
</style></head><body>
<header><p style="margin:0 0 6px"><a href="/" style="color:var(--mu);text-decoration:none">← Ibex.tech</a></p><h1>Beetle Scout</h1><p>Finds mountain pine beetle red-attack crowns in drone stills and video. Everything runs in your browser; nothing is uploaded.</p></header>
<div class="bar" id="samples"></div>
<div class="bar">
<label class="btn up">⬆ Upload photos / videos<input id="file" type="file" accept="image/*,video/*" multiple hidden></label>
<button id="scanv" disabled>Scan 12 frames</button>
<span>Sensitivity <input id="sens" type="range" min="0" max="100" value="50"></span>
<span>Host species <select id="sp"><option value="lodgepole">Lodgepole pine</option><option value="ponderosa">Ponderosa pine</option><option value="limber">Limber / other pine</option><option value="spruce">Spruce</option><option value="dfir">Douglas-fir</option><option value="unsure">Not sure</option></select></span>
<button id="rerun">Re-run</button>
<span class="mu" id="status"></span>
</div>
<div class="bar" id="rbar"><b>Worker route</b>
<span>Include <select id="rin"><option value="40">40%+ (inspect + remove)</option><option value="70">70%+ (remove only)</option></select></span>
<span>Image width <input id="wm" type="number" min="1" placeholder="m" style="width:64px"> m</span>
<button id="rset">Set start</button><button id="rbuild">Trace route</button><button id="rnext">Next tree ▶</button><button id="rclr">Clear</button><button id="rlog">Save field log</button><span class="mu" id="rsum"></span></div>
<div id="thumbs" class="bar"></div>
<div class="bar" id="gbar"><b>Guide me</b><button id="gtrk">Track me</button><button id="gpin">I’m at this tree</button><button id="gman">Place me</button><button id="gclr">Reset pins</button><label class="mu"><input type="checkbox" id="gvoice"> Voice</label><span class="mu" id="gcal"></span></div>
<main>
<div id="stage"><canvas id="cv"></canvas>
<div id="zc"><button id="zi" title="Zoom in">+</button><button id="zo" title="Zoom out">−</button><button id="zf" title="Fit">Fit</button><button id="z1" title="Actual pixels">1:1</button><button id="zm" title="Center on me">◎</button></div>
<div id="zl"></div><div id="lg"><span><i style="background:#e5392d"></i>Remove</span><span><i style="background:#e08a00"></i>Inspect &amp; treat</span><span><i style="background:#5b7a8c"></i>Monitor</span><span><i style="background:#00e5ff"></i>Route</span></div><div id="guide"><span id="garr">▲</span><div style="flex:1"><b id="gtxt"></b><div id="gsub" style="font-size:12px;opacity:.9"></div></div><button id="gskip">Skip</button></div>
<button id="fab">📷 Photo this tree</button><input id="fabf" type="file" accept="image/*" multiple hidden>
<div id="sheet"><button id="sx">✕</button><div id="sbody"></div></div>
<div id="drop">Drop photos or videos here to scan</div></div>
<aside><div id="info"></div><div id="list"></div></aside>
</main>
<script src="/beetle-scout-app.js"></script>
<script src="/beetle-scout-app2.js"></script>
</body></html>
